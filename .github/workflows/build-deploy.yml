name: Build & Deploy — SaaS Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e

            IMAGE="ghcr.io/${{ github.repository }}"
            NEW_TAG="${{ needs.build.outputs.image_tag }}"

            echo "=== Pulling new image: $IMAGE:$NEW_TAG ==="
            docker pull "$IMAGE:$NEW_TAG"

            echo "=== Capturing previous image for rollback ==="
            PREV_IMAGE=$(docker inspect zsms_saas_frontend_c --format='{{.Config.Image}}' 2>/dev/null || echo "")
            echo "Previous image: $PREV_IMAGE"

            echo "=== Stopping old container ==="
            docker stop zsms_saas_frontend_c 2>/dev/null || true
            docker rm zsms_saas_frontend_c 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name zsms_saas_frontend_c \
              --restart unless-stopped \
              --network zsms-network \
              -p 127.0.0.1:14100:3000 \
              "$IMAGE:$NEW_TAG"

            echo "=== Waiting for healthcheck (max 90s) ==="
            HEALTH=""
            for i in $(seq 1 18); do
              sleep 5
              HEALTH=$(docker inspect zsms_saas_frontend_c --format='{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              echo "  attempt $i/18 - health: $HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                echo "Container healthy after $((i*5))s"
                break
              fi
            done

            if [ "$HEALTH" != "healthy" ]; then
              echo "New container not healthy - rolling back!"
              docker stop zsms_saas_frontend_c
              docker rm zsms_saas_frontend_c
              if [ -n "$PREV_IMAGE" ]; then
                docker run -d \
                  --name zsms_saas_frontend_c \
                  --restart unless-stopped \
                  --network zsms-network \
                  -p 127.0.0.1:14100:3000 \
                  "$PREV_IMAGE"
                echo "Rolled back to $PREV_IMAGE"
              fi
              exit 1
            fi

            echo "=== Verifying public URL ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://app.zsmsapp.com/ || echo "000")
            echo "HTTP response: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "307" ] && [ "$HTTP_CODE" != "308" ]; then
              echo "Public URL returning $HTTP_CODE - check nginx/Plesk"
              exit 1
            fi

            echo "=== Cleaning up old images (keeping last 5) ==="
            docker image prune -f
            docker images "$IMAGE" --format "{{.ID}} {{.CreatedAt}}" | sort -k2 -r | tail -n +6 | awk '{print $1}' | xargs -r docker rmi 2>/dev/null || true

            echo "=== Deploy complete ==="
            echo "Image: $IMAGE:$NEW_TAG"
            echo "URL: https://app.zsmsapp.com"
